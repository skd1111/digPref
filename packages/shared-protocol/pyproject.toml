[project]
name = "shared-protocol"
version = "0.1.0"
description = "Cross-language protocol types (TS + Py)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocol"]