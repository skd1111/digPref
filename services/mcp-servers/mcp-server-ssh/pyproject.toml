[project]
name = "mcp-server-ssh"
version = "0.1.0"
description = "MCP server — SSH command execution with blacklist/whitelist"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp>=1.0",
    "asyncssh>=2.14",
    "pyyaml>=6.0",
    "shared-protocol",
]

[project.scripts]
mcp-server-ssh = "mcp_server_ssh.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_ssh"]