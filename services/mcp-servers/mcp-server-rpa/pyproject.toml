[project]
name = "mcp-server-rpa"
version = "0.1.0"
description = "MCP server — Playwright-based headless browser RPA"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp>=1.0",
    "playwright>=1.44",
    "pyyaml>=6.0",
    "shared-protocol",
]

[project.scripts]
mcp-server-rpa = "mcp_server_rpa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_rpa"]