[project]
name = "mcp-server-rest"
version = "0.1.0"
description = "MCP server — REST/HTTP API calls with whitelist and method policy"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "shared-protocol",
]

[project.scripts]
mcp-server-rest = "mcp_server_rest.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_rest"]