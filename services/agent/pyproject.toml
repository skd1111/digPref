[project]
name = "agent"
version = "0.1.0"
description = "Enterprise AI IDE — control layer (LangGraph + FastAPI)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "websockets>=12",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-ollama>=0.1",
    "langchain-openai>=0.1",
    "mcp>=1.0",
    "sqlglot>=25",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "shared-protocol",
    # Phase 2F: 代码导航
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "watchfiles>=1.0",
    # Phase 5 V1 RSA 签名
    "cryptography>=41",
    # Phase 15 V0: 前端实时预览引擎（Vite 子进程内存监控）
    "psutil>=5.9",
    # 文档风险合规审核（审核专家 · 文档审核）
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    # Phase 7 数据专家：SQL 结果 DataFrame（从 db-all 提升为主依赖，sql/run 真实执行必需）
    "pandas>=2.0",
    # SSH 会话（agent.ssh.client 运行时 import，未声明会被 uv sync 清理）
    "asyncssh>=2.14",
    # 会话导出 .eas 密钥存取（sessions/export.py 运行时 import，同上）
    "keyring>=25",
    # datetime_now 内置工具农历转换（builtin/extra.py 运行时延迟导入）
    "zhdate>=0.1",
    # file_to_markdown 内置工具：文件转 Markdown（builtin/markdown_convert.py 延迟导入）
    # extras 按办公格式按需：docx/pdf/pptx/xls/xlsx；html/csv/json/epub 在基础包内；
    # 不用 [all]（含 azure / pydub / youtube 等重依赖）
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1",
]

[project.optional-dependencies]
# Phase 7: 数据库驱动（主流 + 国产/信创）
# 安装: pip install agent[db-all] 或按需安装单个组
db-mysql = ["aiomysql>=0.2.0"]                      # MySQL / TiDB / OceanBase / GBase
db-postgres = ["asyncpg>=0.29"]                    # PostgreSQL / KingbaseES / GaussDB / openGauss / HighGo
db-oracle = ["oracledb>=2.0"]                      # Oracle
db-sqlserver = ["aioodbc>=0.5", "pyodbc>=5.0"]     # SQL Server
db-clickhouse = ["clickhouse-connect>=0.7"]        # ClickHouse
db-dm = ["dmPython>=2.8"]                          # 达梦(DM) —— 需从达梦官网下载驱动
db-all = [
    "aiomysql>=0.2.0",
    "asyncpg>=0.29",
    "oracledb>=2.0",
    "aioodbc>=0.5",
    "pyodbc>=5.0",
    "clickhouse-connect>=0.7",
    "pandas>=2.0",
]
# Phase 7: 数据专家全量能力（WS/Arrow 流 + 导出 + 沙箱 AST 校验）
data-full = [
    "pyarrow>=16.0",
    "polars>=1.0",
    "openpyxl>=3.1",
    "weasyprint>=62",
    "jinja2>=3.1",
    "RestrictedPython>=7.0",
]
# V9: 复杂文档解析增强（file_to_markdown 的 Docling 兜底；表格结构还原更强）
# markitdown 失败 / 结果为空时自动降级；缺失时静默跳过不崩溃（与 openpyxl 同模式）
parse-full = [
    "docling>=2.0",
]

[project.scripts]
eaide-agent = "agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "mypy>=2.3.0",
    "types-psutil>=5.9",
    "reportlab>=4.0",
    # Phase 7 测试：Parquet 落盘/WS Arrow 流用例必需
    "pyarrow>=16.0",
]
