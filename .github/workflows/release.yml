name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }

      # tauri bundle.resources 通配（resources/* 与 config/driver/*）在 gitignore 后
      # 检出里没有任何文件会直接失败；放非点号占位文件（glob 不匹配 dotfiles）。
      # 注意：端侧 Agent 二进制（eaide-agent）需按平台另行打包后放入 resources/。
      - name: Resource placeholders
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources config/driver
          if ! ls apps/desktop/src-tauri/resources/* >/dev/null 2>&1; then
            echo "placeholder (real agent binary is packaged separately)" > apps/desktop/src-tauri/resources/README.txt
          fi
          if ! ls config/driver/* >/dev/null 2>&1; then
            echo "placeholder (python driver wheels are packaged separately)" > config/driver/README.txt
          fi

      - run: pnpm install --frozen-lockfile

      # 直接调 Tauri 2 CLI（不经 tauri-apps/tauri-action —— 其 args 拼接与 v2 CLI 不兼容）
      # NODE_OPTIONS 抬堆上限：monaco/echarts 重型前端在 mac runner 上 vite build 会 OOM
      - name: Build & bundle
        working-directory: apps/desktop
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          pnpm exec tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}" 2>&1 | tee tauri-build.log

      - name: Surface failure tail
        if: failure()
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' apps/desktop/tauri-build.log > tb.plain || true
          grep -E "^error|Error|error\[|failed|panicked" tb.plain | head -15 | sed 's/^/::error::/'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist-artifacts
      # tag 触发才建 Release（手动 workflow_dispatch 只出 artifact）
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Enterprise AI IDE ${{ github.ref_name }}" \
            --notes "See CHANGELOG.md（macOS 产物未签名，首次打开需右键→打开）" \
            dist-artifacts/*
