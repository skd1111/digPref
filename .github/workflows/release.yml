name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_builds:
        description: "跳过构建，只把最近一次成功 run 的产物发到 Release（用于补发）"
        type: boolean
        default: false
      tag_name:
        description: "skip_builds 时要补发的 tag"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  # ---- Python Agent 单文件二进制（PyInstaller，平台原生，不可交叉编译）----
  build-agent:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_builds) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: agent-macos-arm64
            binary: eaide-agent
          - os: windows-latest
            artifact: agent-windows
            binary: eaide-agent.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install uv
        run: pip install uv
      - run: uv sync --all-packages
      - name: PyInstaller build
        run: uv run pyinstaller eaide-agent.spec --noconfirm --distpath agent-dist --workpath agent-build
      - name: chmod +x
        if: runner.os == 'macOS'
        run: chmod +x agent-dist/eaide-agent
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: agent-dist/${{ matrix.binary }}
          if-no-files-found: error

  build-tauri:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_builds) }}
    needs: build-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac：GitHub 已无 x86 macOS runner，PyInstaller 无法交叉编译，
          # 故只出 Apple Silicon 版（Intel Mac 已停产，Rosetta 用户走云端/源码模式）
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
            agent_artifact: agent-macos-arm64
            agent_file: eaide-agent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            agent_artifact: agent-windows
            agent_file: eaide-agent.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }

      # 端侧 Agent 二进制放入 Tauri resources（随 .app / NSIS 打包）
      - name: Fetch agent binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.agent_artifact }}
          path: apps/desktop/src-tauri/resources
      - name: Make agent executable
        if: runner.os == 'macOS'
        run: chmod +x apps/desktop/src-tauri/resources/${{ matrix.agent_file }}

      # tauri bundle.resources 通配（resources/* 与 config/driver/*）检出里可能无文件
      # 导致打包失败；Agent 已就位时 resources 不再需要占位，config/driver 仍补占位
      - name: Resource placeholders
        shell: bash
        run: |
          mkdir -p config/driver
          if ! ls config/driver/* >/dev/null 2>&1; then
            echo "placeholder (python driver wheels are packaged separately)" > config/driver/README.txt
          fi

      - run: pnpm install --frozen-lockfile

      # 直接调 Tauri 2 CLI（不经 tauri-apps/tauri-action —— 其 args 拼接与 v2 CLI 不兼容）
      # NODE_OPTIONS 抬堆上限：monaco/echarts 重型前端在 mac runner 上 vite build 会 OOM
      # 重试 2 次：NSIS 打包偶发 "io: Peer disconnected" 瞬时错误
      - name: Build & bundle
        working-directory: apps/desktop
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== tauri build attempt $attempt ==="
            if pnpm exec tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}" 2>&1 | tee tauri-build.log; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "build failed, retrying in 20s..."
            sleep 20
          done

      - name: Surface failure tail
        if: failure()
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' apps/desktop/tauri-build.log > tb.plain || true
          grep -E "^error|Error|error\[|failed|panicked" tb.plain | head -15 | sed 's/^/::error::/'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
        continue-on-error: true

  publish:
    needs: build-tauri
    # 部分平台失败也照发已有产物（download 不到任何东西时由后续 guard 判失败）
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # tag 触发：用本次 run 的产物；dispatch+skip_builds：从最近一次成功 run 拉产物
      - name: Resolve source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_builds }}" = "true" ]; then
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow release.yml \
              --json databaseId,conclusion,event \
              --jq '[.[] | select(.conclusion=="success" and .event=="push")] | first | .databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "no previous successful tag run found" >&2
              exit 1
            fi
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist-artifacts
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # tag 触发才发 Release（直接发布，不再 draft，避免人工点 Publish 造成产物丢失；
      # dispatch+skip_builds 走补发；普通 dispatch 只出 artifact）
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.skip_builds)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ls -laR dist-artifacts | tee artifacts-listing.txt
          # artifact 下载后可能带子目录（dmg/、nsis/），只收集真实文件
          mapfile -t files < <(find dist-artifacts -type f)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts downloaded" >&2
            exit 1
          fi
          # dispatch 的 ref 是分支，tag 名从输入参数取
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          REPO="${{ github.repository }}"
          # 确保 release 存在（已发布/草稿都兼容，不存在则直接创建为正式发布）
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Enterprise AI IDE $TAG" \
              --notes "See CHANGELOG.md（macOS 为 Apple Silicon 版且未签名，首次打开需右键→打开）"
          fi
          # 上传产物（--clobber 同名覆盖，重复跑幂等）
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber 2>&1 | tee release.log
          # 若当前是草稿（历史遗留）则转正发布
          gh release edit "$TAG" --repo "$REPO" --draft=false >/dev/null 2>&1 || true
          # 硬校验：确认产物真的挂上了，否则判失败（防止静默丢产物）
          # 用 gh release view（兼容 draft）；REST 的 releases/tags/ 端点对 draft 会 404
          sleep 5
          attached=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "attached assets: $attached"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sed 's/^/  - /'
          if [ "${attached:-0}" -lt ${#files[@]} ]; then
            echo "expected ${#files[@]} assets but found $attached" >&2
            exit 1
          fi
      - name: Surface failure
        if: failure()
        run: |
          [ -f release.log ] && head -20 release.log | sed 's/^/::error::/' || true
          [ -f artifacts-listing.txt ] && head -30 artifacts-listing.txt | sed 's/^/::error::/' || true
