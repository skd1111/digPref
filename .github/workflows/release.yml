name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Python Agent 单文件二进制（PyInstaller，平台原生，不可交叉编译）----
  build-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: agent-macos-arm64
            binary: eaide-agent
          - os: windows-latest
            artifact: agent-windows
            binary: eaide-agent.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install uv
        run: pip install uv
      - run: uv sync --all-packages
      - name: PyInstaller build
        run: uv run pyinstaller eaide-agent.spec --noconfirm --distpath agent-dist --workpath agent-build
      - name: chmod +x
        if: runner.os == 'macOS'
        run: chmod +x agent-dist/eaide-agent
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: agent-dist/${{ matrix.binary }}
          if-no-files-found: error

  build-tauri:
    needs: build-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac：GitHub 已无 x86 macOS runner，PyInstaller 无法交叉编译，
          # 故只出 Apple Silicon 版（Intel Mac 已停产，Rosetta 用户走云端/源码模式）
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
            agent_artifact: agent-macos-arm64
            agent_file: eaide-agent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            agent_artifact: agent-windows
            agent_file: eaide-agent.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }

      # 端侧 Agent 二进制放入 Tauri resources（随 .app / NSIS 打包）
      - name: Fetch agent binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.agent_artifact }}
          path: apps/desktop/src-tauri/resources
      - name: Make agent executable
        if: runner.os == 'macOS'
        run: chmod +x apps/desktop/src-tauri/resources/${{ matrix.agent_file }}

      # tauri bundle.resources 通配（resources/* 与 config/driver/*）检出里可能无文件
      # 导致打包失败；Agent 已就位时 resources 不再需要占位，config/driver 仍补占位
      - name: Resource placeholders
        shell: bash
        run: |
          mkdir -p config/driver
          if ! ls config/driver/* >/dev/null 2>&1; then
            echo "placeholder (python driver wheels are packaged separately)" > config/driver/README.txt
          fi

      - run: pnpm install --frozen-lockfile

      # 直接调 Tauri 2 CLI（不经 tauri-apps/tauri-action —— 其 args 拼接与 v2 CLI 不兼容）
      # NODE_OPTIONS 抬堆上限：monaco/echarts 重型前端在 mac runner 上 vite build 会 OOM
      - name: Build & bundle
        working-directory: apps/desktop
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          pnpm exec tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}" 2>&1 | tee tauri-build.log

      - name: Surface failure tail
        if: failure()
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' apps/desktop/tauri-build.log > tb.plain || true
          grep -E "^error|Error|error\[|failed|panicked" tb.plain | head -15 | sed 's/^/::error::/'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist-artifacts
      # tag 触发才建 Release（手动 workflow_dispatch 只出 artifact）
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ls -laR dist-artifacts | tee artifacts-listing.txt
          # artifact 下载后可能带子目录（dmg/、nsis/），只收集真实文件
          mapfile -t files < <(find dist-artifacts -type f)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts downloaded" >&2
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # 确保 release 存在（兼容旧 draft / 首次创建两种情况）
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Enterprise AI IDE $TAG" \
              --notes "See CHANGELOG.md（macOS 为 Apple Silicon 版且未签名，首次打开需右键→打开）"
          fi
          # 上传产物（--clobber 同名覆盖，重复跑幂等）
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber 2>&1 | tee release.log
          # 硬校验：确认产物真的挂上了，否则判失败（防止静默丢产物）
          # 用 gh release view（兼容 draft）；REST 的 releases/tags/ 端点对 draft 会 404
          sleep 5
          attached=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "attached assets: $attached"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | sed 's/^/  - /'
          if [ "${attached:-0}" -lt ${#files[@]} ]; then
            echo "expected ${#files[@]} assets but found $attached" >&2
            exit 1
          fi
      - name: Surface failure
        if: failure()
        run: |
          [ -f release.log ] && head -20 release.log | sed 's/^/::error::/' || true
          [ -f artifacts-listing.txt ] && head -30 artifacts-listing.txt | sed 's/^/::error::/' || true
