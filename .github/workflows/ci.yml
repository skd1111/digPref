name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install uv
        run: pip install uv
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # services 层存量类型债务 1000+ 待逐步补齐；协议包（线协议唯一来源）必须保持 strict 通过
      - run: uv run mypy packages

  test-py:
    runs-on: ubuntu-latest
    needs: lint-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install uv
      - run: uv sync --all-packages
      - run: uv run pytest -q

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准，避免 "Multiple versions of pnpm specified" 冲突
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test-js:
    runs-on: ubuntu-latest
    needs: lint-js
    steps:
      - uses: actions/checkout@v5
      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准，避免 "Multiple versions of pnpm specified" 冲突
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: cd apps/desktop/src-tauri && cargo clippy --all-targets -- -D warnings

  test-rust:
    runs-on: ubuntu-latest
    needs: lint-rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: cd apps/desktop/src-tauri && cargo test --all