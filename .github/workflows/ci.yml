name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install uv
        run: pip install uv
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # services 层存量类型债务 1000+ 待逐步补齐；协议包（线协议唯一来源）必须保持 strict 通过
      - run: uv run mypy packages

  test-py:
    runs-on: ubuntu-latest
    needs: lint-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install uv
      - run: uv sync --all-packages
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log
      # 失败时把关键行发成 annotation（无 Actions 权限也能经 check-run API 读到）
      - name: Surface failure tail
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' pytest.log > pytest.plain || true
          {
            echo '```'
            tail -n 100 pytest.plain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR)" pytest.plain | head -10 | sed 's/^/::error::/'

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准，避免 "Multiple versions of pnpm specified" 冲突
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test-js:
    runs-on: ubuntu-latest
    needs: lint-js
    steps:
      - uses: actions/checkout@v5
      # 不传 version：pnpm 版本以 package.json 的 packageManager 字段为准，避免 "Multiple versions of pnpm specified" 冲突
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: vitest
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest.log
      - name: Surface failure tail
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' vitest.log > vitest.plain || true
          {
            echo '```'
            tail -n 100 vitest.plain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -B1 -A6 -E "(FAIL|×|✗)" vitest.plain | head -40 | sed 's/^/::error::/'

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Tauri 2.0 Linux 构建所需系统库（ubuntu-latest 未预装 webkit2gtk）
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev file
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - name: clippy
        run: |
          set -o pipefail
          cd apps/desktop/src-tauri && cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Surface failure tail
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' apps/desktop/src-tauri/clippy.log > clippy.plain || true
          {
            echo '```'
            tail -n 100 clippy.plain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -A6 "^error" clippy.plain | head -40 | sed 's/^/::error::/'

  test-rust:
    runs-on: ubuntu-latest
    needs: lint-rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev file
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - name: cargo test
        run: |
          set -o pipefail
          cd apps/desktop/src-tauri && cargo test --all 2>&1 | tee cargo-test.log
      - name: Surface failure tail
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' apps/desktop/src-tauri/cargo-test.log > cargo-test.plain || true
          {
            echo '```'
            tail -n 100 cargo-test.plain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -B2 -A8 "FAILED\\|panicked" cargo-test.plain | head -40 | sed 's/^/::error::/'
