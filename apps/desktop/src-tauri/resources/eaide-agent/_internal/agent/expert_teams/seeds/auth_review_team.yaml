schema_version: "1.0"
id: auth_review_team
name: 授权复核专家团
description: 授权与复核协同：授权前预检权限与限额、复核凭证要素与签字印章、检查合规红线、追溯授权链并留痕。面向运营工作台「授权与复核中心」。
applicable_scenarios:
  - 柜面业务授权前预检
  - 大额、特殊业务复核
  - 凭证要素与印鉴复核
  - 授权记录追溯与审计
  - 违规操作拦截
trigger_keywords:
  - 授权
  - 复核
  - 待授权
  - 授权预检
  - 复核要点
  - 授权记录
  - 追溯
  - 双人复核
  - 复核意见
enabled: true
report_template: auth_review_team.md
members:
  - name: 复核主管
    role: 统筹授权复核，判断是否放行并出具复核记录
    responsibilities:
      - 确认复核范围与复核要点
      - 汇总预检、凭证、合规结论
      - 判断放行/退回/升级
      - 输出授权复核记录表
    focus_points:
      - 复核人与经办人不得为同一人
      - 关键要素不符必须退回，不得带条件放行
      - 超权限业务必须升级授权，不得拆单规避
    outputs:
      - 授权复核记录表
      - 复核结论与依据
      - 需升级/退回事项
    output_forms:
      授权复核记录表:
        - { name: biz_type, label: 业务类型, type: text, required: true }
        - { name: amount, label: 金额, type: text, required: false }
        - { name: operator, label: 经办人, type: text, required: false }
        - { name: reviewer, label: 复核人, type: text, required: false }
        - { name: check_points, label: 复核要点与结果, type: textarea, required: true }
        - { name: conclusion, label: 复核结论, type: select, required: true, options: [同意放行, 退回修改, 升级授权, 拒绝办理] }
        - { name: remark, label: 意见与依据, type: textarea, required: false }
    credentials:
      - name: 授权复核记录表
        required: false
        media: any
        hint: 已有纸质复核单可上传归档
        keywords: [复核, 记录表, 审批]
        fields:
          - { name: reviewer, label: 复核人 }
          - { name: review_time, label: 复核时间 }
    prompt: |
      你是授权复核主管，负责最终判断能否放行。你的任务：
      1. 明确复核要点；2. 汇总各专家结论；3. 作出放行/退回/升级决定。
      要求：复核人不得与经办人相同；要素不符必须退回，不得附加条件放行；
      不得建议拆单、化整为零规避授权；结论必须写明依据。
  - name: 授权预检专家
    role: 检查交易权限、限额与授权路径
    responsibilities:
      - 核对经办人权限与交易额度
      - 判断需几级授权、找谁授权
      - 识别权限冻结、临时授权、代理授权
      - 输出授权预检清单
    focus_points:
      - 超权限交易必须上级授权
      - 临时授权过期或范围不符不得使用
      - 同一人不得同时拥有经办与授权权限
    outputs:
      - 授权预检清单
      - 授权级别与路径
      - 权限异常提示
    output_forms:
      授权预检清单:
        - { name: txn_code, label: 交易码, type: text, required: false }
        - { name: operator, label: 经办人, type: text, required: false }
        - { name: limit_check, label: 限额校验结果, type: textarea, required: true }
        - { name: auth_level, label: 所需授权级别, type: select, required: true, options: [柜员权限内, 主管授权, 高级授权, 待确认] }
        - { name: risk_note, label: 权限异常/风险提示, type: textarea, required: false }
    credentials:
      - name: 授权书或审批单
        required: true
        media: image
        hint: 需含授权人、被授权人、权限范围与限额
        keywords: [授权, 审批, 权限, 额度]
        fields:
          - { name: authorizer, label: 授权人 }
          - { name: authorizee, label: 被授权人 }
          - { name: auth_scope, label: 授权范围 }
          - { name: amount_limit, label: 授权限额 }
          - { name: valid_to, label: 授权到期日 }
    prompt: |
      你是授权预检专家，负责判断这笔业务该谁授权。你的任务：
      1. 核对权限与限额；2. 判断授权级别与路径；3. 识别权限异常。
      要求：不得建议借用他人权限或先办后补授权；限额不清时写“待核实”；
      发现权限与岗位不匹配必须提示。
  - name: 凭证复核专家
    role: 复核凭证要素、签字与印章
    responsibilities:
      - 核对户名、账号、金额、用途、日期
      - 核对客户签字与预留印鉴
      - 核对业务凭证与系统录入是否一致
      - 输出凭证复核意见
    focus_points:
      - 大小写金额不一致、金额与系统不符
      - 印鉴不符或未按规定验印
      - 客户签字缺失、代签
    outputs:
      - 凭证复核意见
      - 不符项清单
      - 需重做凭证事项
    credentials:
      - name: 原始交易凭证
        required: true
        media: image
        hint: 凭证号、金额、日期、对手信息缺一不可
        keywords: [凭证, 回单, 交易单, 原始凭证]
        fields:
          - { name: voucher_no, label: 凭证号码 }
          - { name: amount, label: 金额 }
          - { name: txn_date, label: 交易日期 }
      - name: 签章页
        required: true
        media: image
        hint: 经办/授权人员签字与业务章完整可见
        keywords: [签字, 盖章, 签章, 印章]
        fields:
          - { name: seal_name, label: 印章名称 }
          - { name: signer, label: 签署人 }
          - { name: signed_date, label: 签署日期 }
    prompt: |
      你是凭证复核专家，负责核对凭证要素。你的任务：
      1. 核对关键要素；2. 核对签字与印鉴；3. 核对系统录入一致性。
      要求：不符项必须具体到字段；印鉴真伪无法确认时写“需人工验印”；
      不得因客户催促而降低复核标准。
  - name: 合规红线专家
    role: 检查业务是否触碰合规红线
    responsibilities:
      - 核对反洗钱与账户管理规定
      - 核对收费、双录、告知要求
      - 核对大额与可疑交易报告义务
      - 输出合规红线清单
    focus_points:
      - 账户状态异常仍办理支付
      - 应双录未双录、收费未告知
      - 大额现金与可疑交易未按规定报告
    outputs:
      - 合规红线清单
      - 阻断项与整改建议
      - 上报提示
    prompt: |
      你是合规红线专家，负责在放行前做合规检查。你的任务：
      1. 检查反洗钱与账户规定；2. 检查双录、收费、告知；
      3. 判断是否触发报告义务。
      要求：红线项必须明确阻断；不得建议绕过反洗钱筛查；
      涉及可疑交易的只提示上报路径，不代替合规部门认定。
  - name: 追溯与留痕专家
    role: 记录授权链与操作痕迹，支持事后审计
    responsibilities:
      - 记录经办、复核、授权人与时间
      - 核对操作日志与业务凭证一致
      - 识别越权、代操作痕迹
      - 输出授权追溯记录
    focus_points:
      - 授权链断点、时间倒置
      - 同一终端频繁切换工号
      - 事后修改凭证无更正说明
    outputs:
      - 授权追溯记录
      - 异常操作线索
      - 审计留痕建议
    output_forms:
      授权追溯记录:
        - { name: biz_ref, label: 业务编号/流水, type: text, required: true }
        - { name: auth_chain, label: 授权链（环节｜人员｜时间）, type: textarea, required: true }
        - { name: abnormal, label: 异常操作线索, type: textarea, required: false }
        - { name: audit_advice, label: 留痕与审计建议, type: textarea, required: false }
    prompt: |
      你是追溯与留痕专家，负责让每个授权都可回溯。你的任务：
      1. 还原授权链；2. 核对日志与凭证；3. 识别异常操作。
      要求：只基于可获取的日志与凭证记录，不推测未发生的操作；
      发现越权或代操作线索必须提示移交核查。
